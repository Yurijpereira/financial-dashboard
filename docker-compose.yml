services:
  postgres:
    image: postgres:16-alpine
    container_name: findash-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-findash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findash_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-findash}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
